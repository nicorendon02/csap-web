name: Update YouTube Videos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: write

concurrency:
  group: youtube-videos
  cancel-in-progress: false

env:
  TARGET_BRANCH: feature/database

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Update YouTube videos JSON
        run: npm run update:youtube

      - name: Commit updated JSON
        run: |
          if git diff --quiet -- data/youtube-videos.json; then
            echo "No YouTube video changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-videos.json
          git commit -m "update youtube videos"
          git push origin HEAD:${TARGET_BRANCH}
