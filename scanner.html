<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan Tickets — CSAP Portal</title>
  <meta name="description" content="CSAP admin QR ticket scanner for event check-in." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" type="image/x-icon" href="img/csap-logo-rounded.ico" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    .scanner-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f0ede7;
    }
    .scanner-header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      padding: 0 24px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .scanner-header .s-logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.1rem; color: var(--dark);
    }
    .scanner-main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 32px 20px; gap: 20px;
    }
    .scanner-controls {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 24px;
      width: 100%; max-width: 520px;
      box-shadow: var(--shadow);
    }
    .scanner-controls label {
      display: block;
      font-size: 0.78rem; font-weight: 700;
      color: var(--gray-700); margin-bottom: 8px;
      letter-spacing: .5px; text-transform: uppercase;
    }
    .scanner-select {
      width: 100%; padding: 11px 14px;
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--dark);
      font-family: 'Inter', sans-serif; font-size: 0.93rem;
      outline: none; cursor: pointer;
      transition: border-color .2s;
    }
    .scanner-select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(194,154,18,.12); }

    .scanner-viewport {
      width: 100%; max-width: 520px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      box-shadow: var(--shadow);
    }
    #qr-reader { width: 100%; border-radius: 16px; overflow: hidden; }
    #qr-reader video { border-radius: 16px; }

    .scanner-status {
      width: 100%; max-width: 520px;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 0.87rem; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      transition: all .3s;
    }
    .status-idle     { background: var(--white); color: var(--gray-500); border: 1px solid var(--border); }
    .status-scanning { background: #e8f0ff; color: #003087; border: 1px solid #c0d0ff; }
    .status-found    { background: #e6f9f0; color: #15803d; border: 1px solid #bbf0d5; }
    .status-error    { background: #fff0f0; color: #dc2626; border: 1px solid #fecaca; }

    .btn-scanner {
      padding: 11px 26px; border-radius: 999px;
      font-family: 'Inter', sans-serif; font-size: 0.92rem;
      font-weight: 700; cursor: pointer; transition: all .2s;
      border: none; display: flex; align-items: center; gap: 8px;
    }
    .btn-start { background: var(--gold); color: #fff; }
    .btn-start:hover { background: var(--gold-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(194,154,18,.3); }
    .btn-stop  { background: #fee2e2; color: #dc2626; border: 1.5px solid #fecaca; }
    .btn-stop:hover  { background: #dc2626; color: #fff; }

    /* Full-screen green check-in overlay */
    #checkinOverlay {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(135deg, #15803d 0%, #16a34a 60%, #22c55e 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
      animation: overlayIn .4s cubic-bezier(.34,1.2,.64,1);
    }
    @keyframes overlayIn { from{opacity:0;transform:scale(1.05)} to{opacity:1;transform:scale(1)} }
    .checkin-icon {
      font-size: 5rem; color: #fff;
      margin-bottom: 16px;
      animation: popBounce .5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popBounce { from{transform:scale(0)} to{transform:scale(1)} }
    .checkin-title  { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
    .checkin-name   { font-size: 1.5rem; font-weight: 700; color: rgba(255,255,255,.92); margin-bottom: 4px; }
    .checkin-detail { font-size: 0.95rem; color: rgba(255,255,255,.7); margin-bottom: 2px; }
    .checkin-dismiss { font-size: 0.82rem; color: rgba(255,255,255,.5); margin-top: 32px; letter-spacing: .5px; }
    .checkin-chips { display: flex; gap: 10px; margin-top: 14px; }
    .checkin-chip {
      padding: 5px 16px; border-radius: 999px; font-size: 0.82rem;
      font-weight: 700; background: rgba(255,255,255,.2); color: #fff;
      border: 1px solid rgba(255,255,255,.35);
      display: flex; align-items: center; gap: 6px;
    }

    /* ── Manual Check-in Panel ───────────────────── */
    .manual-panel {
      width: 100%; max-width: 520px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .manual-panel-toggle {
      width: 100%; background: none; border: none;
      display: flex; align-items: center; gap: 12px;
      padding: 16px 22px; cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem; font-weight: 700;
      color: var(--gray-700);
      transition: background .15s;
      border-radius: 16px;
    }
    .manual-panel-toggle:hover { background: var(--gray-50, #f9fafb); }
    .manual-panel-toggle .mp-icon {
      width: 30px; height: 30px; border-radius: 8px;
      background: rgba(194,154,18,.12);
      display: flex; align-items: center; justify-content: center;
      color: var(--gold); font-size: 0.9rem; flex-shrink: 0;
    }
    .manual-panel-toggle .mp-chevron {
      margin-left: auto; color: var(--gray-300);
      transition: transform .2s;
    }
    .manual-panel-toggle.open .mp-chevron { transform: rotate(180deg); }
    .manual-panel-body {
      display: none;
      padding: 0 22px 20px;
      border-top: 1px solid var(--border);
    }
    .manual-panel-body.open { display: block; }

    .manual-search-wrap {
      position: relative; margin-top: 16px;
    }
    .manual-search-wrap i {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-300); pointer-events: none;
    }
    .manual-search-input {
      width: 100%; padding: 11px 14px 11px 38px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-family: 'Inter', sans-serif; font-size: 0.92rem;
      color: var(--dark); background: var(--cream);
      outline: none; transition: border-color .2s;
      box-sizing: border-box;
    }
    .manual-search-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(194,154,18,.12);
      background: #fff;
    }
    .manual-search-hint {
      font-size: 0.75rem; color: var(--gray-400);
      margin: 6px 0 0 2px;
    }

    .manual-results {
      margin-top: 14px;
      display: flex; flex-direction: column; gap: 8px;
      max-height: 340px; overflow-y: auto;
    }
    .manual-result-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--cream); transition: border-color .15s;
    }
    .manual-result-row:hover { border-color: var(--gold); }
    .manual-result-row.already-in {
      background: #f0fdf4; border-color: #bbf7d0;
      opacity: .75;
    }
    .mr-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.88rem; flex-shrink: 0;
      color: #fff; background: var(--gold);
    }
    .mr-avatar.checked { background: #16a34a; }
    .mr-info { flex: 1; min-width: 0; }
    .mr-name {
      font-weight: 700; font-size: 0.9rem;
      color: var(--dark); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .mr-meta {
      font-size: 0.75rem; color: var(--gray-400);
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px;
    }
    .mr-badge {
      font-size: 0.68rem; font-weight: 700; padding: 2px 7px;
      border-radius: 999px;
    }
    .mr-badge-entry { background: #e0e7ff; color: #3730a3; }
    .mr-badge-food  { background: #ffe4e6; color: #9f1239; }
    .mr-badge-checked { background: #dcfce7; color: #15803d; }
    .btn-manual-checkin {
      padding: 7px 14px; border-radius: 8px;
      background: var(--gold); color: #fff;
      border: none; cursor: pointer; font-size: 0.8rem;
      font-family: 'Inter', sans-serif; font-weight: 700;
      white-space: nowrap; transition: all .15s; flex-shrink: 0;
    }
    .btn-manual-checkin:hover { background: var(--gold-dark); transform: translateY(-1px); }
    .btn-manual-checkin:disabled {
      background: #d1d5db; cursor: default; transform: none;
    }
    .manual-empty {
      text-align: center; padding: 24px 0;
      color: var(--gray-300); font-size: 0.85rem;
    }
  </style>
</head>
<body class="scanner-page">

  <!-- Header -->
  <header class="scanner-header">
    <div class="s-logo">
      <div style="width:32px;height:32px;background:var(--gold);border-radius:50%;
                  display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-coins" style="color:#fff;font-size:1rem;"></i>
      </div>
      <span>CSAP</span>
      <span style="font-size:0.75rem;font-weight:500;color:var(--gray-500);
                   background:var(--cream);padding:3px 10px;border-radius:999px;
                   border:1px solid var(--border);">
        Ticket Scanner
      </span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <span id="scannerUserName" style="font-size:0.82rem;color:var(--gray-500);"></span>
      <a href="members.html" class="btn btn-outline" style="padding:7px 14px;font-size:0.8rem;">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
      <a href="php/logout.php" style="font-size:0.8rem;color:var(--gray-300);text-decoration:none;">Logout</a>
    </div>
  </header>

  <main class="scanner-main">

    <!-- Event selector -->
    <div class="scanner-controls">
      <label for="scanEventSelect">Select Event to Scan</label>
      <select class="scanner-select" id="scanEventSelect">
        <option value="">Loading events…</option>
      </select>
    </div>

    <!-- Camera viewport -->
    <div class="scanner-viewport">
      <div id="qr-reader"></div>
    </div>

    <!-- Status bar -->
    <div class="scanner-status status-idle" id="scanStatus">
      <i class="fa-solid fa-circle-info"></i>
      Select an event and start the scanner.
    </div>

    <!-- Start / Stop buttons -->
    <div style="display:flex;gap:14px;">
      <button class="btn-scanner btn-start" id="startBtn" onclick="startScanner()">
        <i class="fa-solid fa-camera"></i> Start Scanner
      </button>
      <button class="btn-scanner btn-stop" id="stopBtn" onclick="stopScanner()" style="display:none;">
        <i class="fa-solid fa-stop"></i> Stop
      </button>
    </div>

    <!-- Manual Check-in Panel -->
    <div class="manual-panel" id="manualPanel">
      <button class="manual-panel-toggle" id="manualToggle" onclick="toggleManualPanel()">
        <div class="mp-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
        <span>Manual Check-in — Search by Name</span>
        <i class="fa-solid fa-chevron-down mp-chevron"></i>
      </button>
      <div class="manual-panel-body" id="manualPanelBody">

        <div class="manual-search-wrap">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="search"
            id="manualSearchInput"
            class="manual-search-input"
            placeholder="Type first name, last name, or PUID…"
            autocomplete="off"
            oninput="onManualSearch(this.value)"
          />
        </div>
        <p class="manual-search-hint">Select an event above first. Results appear as you type (min 2 characters).</p>

        <div class="manual-results" id="manualResults">
          <div class="manual-empty" id="manualEmptyState">
            <i class="fa-solid fa-users" style="font-size:1.6rem;margin-bottom:8px;display:block;"></i>
            Start typing to search attendees
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- Full-screen check-in overlay (hidden by default) -->
  <div id="checkinOverlay" style="display:none;" onclick="dismissOverlay()">
    <div class="checkin-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="checkin-title">Check-in Successful!</div>
    <div class="checkin-name" id="overlayName"></div>
    <div class="checkin-detail" id="overlayPuid"></div>
    <div class="checkin-detail" id="overlayGuests"></div>
    <div class="checkin-chips" id="overlayChips"></div>
    <div class="checkin-dismiss">Tap anywhere to continue scanning</div>
  </div>

  <script src="js/scanner.js"></script>
</body>
</html>
