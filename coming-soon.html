<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — CSAP | Colombian Student Association at Purdue</title>
  <meta name="description" content="The new CSAP website is coming soon." />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--cream);
      overflow: hidden;
      padding: 24px;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .spinner-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(
        var(--col-yellow) 0deg 180deg, 
        var(--col-blue) 180deg 270deg, 
        var(--col-red) 270deg 360deg
      );
      animation: spin 4s linear infinite;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    
    /* Adds a subtle blur glow to the spinning ring */
    .spinner-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      filter: blur(12px);
      opacity: 0.5;
      z-index: -1;
    }

    .spinner-inner {
      position: absolute;
      inset: 0;
      background: var(--cream);
      border-radius: 50%;
      z-index: 1;
    }

    .logo-center {
      position: relative;
      width: 86px;
      height: 86px;
      z-index: 2;
      animation: pulse 2.5s ease-in-out infinite alternate;
    }

    .logo-center img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    .hype-content {
      animation: fadeUp 1.2s ease-out forwards;
      opacity: 0;
    }

    .hype-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .hype-subtitle {
      font-size: 1.15rem;
      color: var(--gray-500);
      max-width: 520px;
      line-height: 1.6;
      font-weight: 400;
      margin: 0 auto;
    }

    .dots {
      display: inline-block;
      width: 24px;
      text-align: left;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <link rel="icon" type="image/x-icon" href="img/csap-logo-rounded.ico" />
</head>
<body>

  <div class="loading-container">
    <div class="spinner-wrapper">
      <div class="spinner-ring"></div>
      <div class="spinner-inner"></div>
      <div class="logo-center">
        <img src="img/csap-logo-transparent.png" alt="CSAP Logo" />
      </div>
    </div>

    <div class="hype-content">
      <h1 class="hype-title">Something exciting is brewing<span class="dots" id="loadingDots">...</span></h1>
      <p class="hype-subtitle">We are polishing the final details of the new CSAP digital experience. Get ready to connect and grow with us.</p>
    </div>
  </div>

  <script>
    // Simple animated dots
    const dots = document.getElementById('loadingDots');
    let count = 3;
    setInterval(() => {
      count = (count + 1) % 4;
      dots.textContent = '.'.repeat(count);
    }, 500);
  </script>

</body>
</html>
